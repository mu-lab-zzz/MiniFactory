name: Gemini AI Coder

on:
  issues:
    types: [opened, labeled]

jobs:
  ai-coder:
    if: github.event.label.name == 'ai' || contains(github.event.issue.labels.*.name, 'ai')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Aider
        run: pip install aider-chat

      - name: Run Gemini Code Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Issueのタイトルと本文を組み合わせてGeminiへのプロンプトを作成
          PROMPT="Issue Title: ${{ github.event.issue.title }}\n\nDetails:\n${{ github.event.issue.body }}"

          # Aiderを介してGeminiにコードを修整・更新させる
          aider --model gemini/gemini-2.5-pro --message "$PROMPT" --yes-always

          # 変更を別ブランチに切ってPush
          BRANCH_NAME="ai-update-issue-${{ github.event.issue.number }}"
          git checkout -b $BRANCH_NAME
          git push origin $BRANCH_NAME

          # Pull Requestを自動作成
          gh pr create --title "AI: ${{ github.event.issue.title }}" --body "Geminiによる自動修正結果です。" --head $BRANCH_NAME --base main
